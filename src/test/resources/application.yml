spring:
  config:
    activate:
      on-profile: test

  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:test;MODE=MYSQL
    username: test
    password: test

  flyway:
    enabled: true

  cloud:
    aws:
      credentials:
        access-key: access-key
        secret-key: secret-key

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

external:
  aws:
    s3:
      region: region
      attachment:
        bucket:
          name: name
        key:
          prefix: prefix
